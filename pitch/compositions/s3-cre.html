            <svg id="s3-link" viewBox="0 0 1920 1080">

              <path id="s3-f1" class="flow" d="M 530 530 C 640 530 700 530 790 530" pathLength="1" />
              <path id="s3-f2" class="flow" d="M 1130 530 C 1220 530 1280 530 1390 530" pathLength="1" />

              <h4>NYC ACRIS</h4><p>Public land records, behind a government API</p>
            </div>
            <div id="s3-tk" class="s3-end card">
              <svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" /><circle cx="42" cy="42" r="22" /></svg>

      <script>
        (() => {
          // five nodes bridging the gap (fixed layout)
          const P = [[960, 400], [850, 470], [1070, 470], [890, 600], [1030, 600]];
          const host = document.getElementById("s3-nodes");
          P.forEach(([x, y], i) => { const n = document.createElement("div"); n.className = "s3-n"; n.id = "s3n" + i; n.style.left = x + "px"; n.style.top = y + "px"; n.textContent = "N" + (i + 1); host.appendChild(n); });

          const tl = gsap.timeline({ paused: true });
          const inn = (sel, at) => tl.fromTo(sel + " .ln > span", { yPercent: 135, rotate: 3 }, { yPercent: 0, rotate: 0, duration: 0.85, stagger: 0.12, ease: "expo.out" }, at);
          tl.fromTo("#s3-world", { scale: 1.03 }, { scale: 1.0, duration: 20.9, ease: "none" }, 0);
          tl.set(["#s3-flow .s3-s", "#s3-flow .s3-ar", "#s3-sdk"], { opacity: 0 }, 0);

          // "Why Chainlink CRE?"
          inn("#s3-ta", 0.2);
          // "A lien lives in a government database, and a smart contract can't read one."
          tl.fromTo("#s3-db", { opacity: 0, x: -80, rotate: -3 }, { opacity: 1, x: 0, rotate: 0, duration: 0.8, ease: "expo.out" }, 2.1)
            .fromTo("#s3-tk", { opacity: 0, x: 80, rotate: 3 }, { opacity: 1, x: 0, rotate: 0, duration: 0.8, ease: "expo.out" }, 3.8)
            .fromTo("#s3-dash", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.3)
            .fromTo("#s3-x", { scale: 0, rotate: -90 }, { scale: 1, rotate: 0, duration: 0.5, ease: "back.out(2.4)" }, 4.7)
            .fromTo("#s3-xl", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.9);
          // "CRE lets a decentralized network of nodes fetch that API, agree on the answer, and write it on-chain"
          tl.to(["#s3-x", "#s3-xl", "#s3-dash"], { opacity: 0, scale: 0.8, duration: 0.35, ease: "power2.in" }, 6.1)
            .fromTo(".s3-n", { scale: 0, opacity: 0, rotate: -60 }, { scale: 1, opacity: 1, rotate: 0, duration: 0.55, stagger: 0.08, ease: "back.out(2)" }, 6.4)
            .fromTo("#s3-f1", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 8.1)
            .fromTo("#s3-vf", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 8.15)
            .to(".s3-n", { scale: 1.12, duration: 0.25, stagger: 0.04, yoyo: true, repeat: 1, ease: "power2.inOut" }, 9.3)
            .fromTo("#s3-va", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 9.3)
            .fromTo("#s3-f2", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 10.6)
            .fromTo("#s3-vw", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 10.65)
            .to("#s3-tk", { outlineWidth: 6, duration: 0.4 }, 11.1)
          // "with no single server to trust."
            .fromTo("#s3-nos", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 11.6);

          // "Our workflow is four steps:" the diagram clears, the pipeline builds
          tl.to("#s3-ta .ln > span", { yPercent: -135, duration: 0.5, ease: "power3.in" }, 13.3)
            .to("#s3-gap", { opacity: 0, y: -40, scale: 0.96, duration: 0.55, ease: "power3.in" }, 13.3)
            .set("#s3-ta", { opacity: 0 }, 13.85)
            .set("#s3-tb", { opacity: 1 }, 13.7);
          inn("#s3-tb", 13.75);
          const step = (n, at) => tl.fromTo("#s3-s" + n, { opacity: 0, y: 70, rotate: n % 2 ? -2 : 2 }, { opacity: 1, y: 0, rotate: 0, duration: 0.7, ease: "expo.out" }, at);
          step(1, 15.2); tl.fromTo("#s3-a1", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3 }, 15.9);
          step(2, 16.2); tl.fromTo("#s3-a2", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3 }, 17.4);
          step(3, 18.2); tl.fromTo("#s3-a3", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3 }, 18.9);
          step(4, 19.1);
          tl.fromTo("#s3-sdk", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 19.5);
          window.__timelines["s3-cre"] = tl;
        })();
