<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s2-root { position: absolute; inset: 0; color: #f4f7fb; }
        #s2-world { position: absolute; inset: 0; transform-origin: 70% 55%; }
        .s2-t { position: absolute; left: 112px; top: 250px; font-size: 128px; color: #f4f7fb; white-space: nowrap; }
        .s2-t .hot { color: #ef5a30; }
        .s2-small { position: absolute; left: 118px; font: 700 24px/1.5 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: rgba(244,247,251,.62); }
        #s2-bsvg { position: absolute; left: 1130px; top: 200px; overflow: visible; }
        #s2-bsvg * { fill: none; stroke: #f4f7fb; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
        #s2-bsvg .win { stroke-width: 3; }
        #s2-orbit { position: absolute; left: 1030px; top: 200px; width: 760px; height: 760px; }
        .s2-sh { position: absolute; left: 362px; top: 362px; width: 36px; height: 36px; border-radius: 50%; background: #f4f7fb; box-shadow: 0 0 0 6px rgba(244,247,251,.16), 0 0 24px rgba(244,247,251,.5); }
        .s2-sh::after { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: #ef5a30; }
        #s2-clock { position: absolute; left: 860px; top: 690px; width: 270px; height: 270px; display: grid; place-items: center; }
        #s2-clock .ring { position: absolute; inset: 0; border-radius: 50%; border: 5px dashed rgba(244,247,251,.45); }
        #s2-clock b { font: 900 70px/1 "Archivo", sans-serif; font-stretch: 125%; letter-spacing: -.03em; }
        .s2-chip { position: absolute; padding: 14px 26px 12px; border-radius: 16px; background: #ef4f26; color: #fff; box-shadow: 0 24px 40px -14px rgba(239,79,38,.7); text-align: center; }
        .s2-chip b { display: block; font: 800 36px/1 "Inter Tight", sans-serif; letter-spacing: -.01em; }
        .s2-chip i { display: block; margin-top: 6px; font: 700 17px/1 "JetBrains Mono", monospace; letter-spacing: .14em; font-style: normal; opacity: .85; }
        .s2-ring { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 5px solid #ef5a30; opacity: 0; }
        #s2-diag { position: absolute; left: 118px; top: 640px; width: 900px; height: 330px; }
        #s2-diag .node { position: absolute; display: flex; align-items: center; gap: 22px; padding: 22px 28px; border-radius: 22px; border: 3px solid rgba(244,247,251,.8); background: rgba(244,247,251,.06); font: 700 26px/1.15 "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
        #s2-diag svg * { fill: none; stroke: #f4f7fb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        #s2-eye { position: absolute; left: 112px; top: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 34px; }
        #s2-eye svg * { fill: none; stroke: #ef5a30; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        #s2-eye span { font: 900 92px/.92 "Archivo", sans-serif; font-stretch: 125%; text-transform: uppercase; color: #f4f7fb; letter-spacing: -.035em; }
        #s2-eye span em { font-style: normal; color: #ef5a30; }
      </style>

      <div id="s2-root" data-composition-id="s2-problem" data-width="1920" data-height="1080">
        <div id="s2-world">
          <svg id="s2-bsvg" width="560" height="760" viewBox="0 0 560 760">
            <rect id="s2-b0" x="40" y="70" width="480" height="680" rx="12" pathLength="1" />
            <path id="s2-b1" d="M18 70 H542" pathLength="1" />
            <path id="s2-b2" d="M240 750 V640 a40 40 0 0 1 80 0 V750" pathLength="1" />
          </svg>
          <div id="s2-orbit"></div>
          <div id="s2-clock"><div class="ring"></div><b>24/7</b></div>
          <div id="s2-c1" class="s2-chip" style="left:1190px; top:-150px"><b>TAX LIEN</b><i>TLS</i></div>
          <div id="s2-c2" class="s2-chip" style="left:1330px; top:-150px"><b>FEDERAL LIEN</b><i>FL</i></div>
          <div id="s2-c3" class="s2-chip" style="left:1215px; top:-150px"><b>JUDGMENT</b><i>JUDG</i></div>
          <div id="s2-r1" class="s2-ring" style="left:1300px; top:420px"></div>
          <div id="s2-r2" class="s2-ring" style="left:1460px; top:590px"></div>
          <div id="s2-r3" class="s2-ring" style="left:1330px; top:735px"></div>
        </div>

        <div id="s2-ta" class="s2-t disp" data-layout-ignore><span class="ln"><span>Tokenized.</span></span></div>
        <div id="s2-sa" class="s2-small" style="top:430px">Shares in one building<br />On-chain · around the clock</div>
        <div id="s2-tb" class="s2-t disp" data-layout-ignore style="top: 210px; font-size: 136px"><span class="ln"><span>The law</span></span><span class="ln"><span>doesn’t</span></span><span class="ln"><span class="hot">pause.</span></span></div>
        <div id="s2-tc" class="s2-t disp" data-layout-ignore style="top: 190px; font-size: 86px"><span class="ln"><span>Someone must</span></span><span class="ln"><span>remember to</span></span><span class="ln"><span class="hot">check.</span></span></div>
        <div id="s2-diag">
          <div class="node" style="left:0; top:0">
            <svg width="62" height="62" viewBox="0 0 62 62"><circle cx="31" cy="19" r="11" /><path d="M9 56 a22 22 0 0 1 44 0" /></svg>
            <span>A person<br />remembers</span>
          </div>
          <svg class="abs" style="left:300px; top:50px" width="200" height="40" viewBox="0 0 200 40"><path id="s2-dash" d="M4 20 H190" stroke-dasharray="14 14" /><path d="M176 8 L192 20 L176 32" /></svg>
          <div class="node" style="left:520px; top:0">
            <svg width="66" height="56" viewBox="0 0 66 56"><path d="M4 12 V48 a4 4 0 0 0 4 4 H58 a4 4 0 0 0 4 -4 V18 a4 4 0 0 0 -4 -4 H30 L24 6 H8 a4 4 0 0 0 -4 4 Z" /></svg>
            <span>County<br />record</span>
          </div>
        </div>
        <div id="s2-eye">
          <svg width="190" height="132" viewBox="0 0 130 90"><path d="M6 45 C28 12 102 12 124 45 C102 78 28 78 6 45 Z" /><circle cx="65" cy="45" r="16" /><path d="M20 82 L110 8" /></svg>
          <span>The chain<br /><em>never looks.</em></span>
        </div>
        <div id="s2-td" class="s2-t disp" data-layout-ignore style="top: 250px; font-size: 78px"><span class="ln"><span>And the shares</span></span><span class="ln"><span class="hot">keep moving.</span></span></div>
      </div>

      <script>
        (() => {
          // orbiting share tokens (fixed angles, deterministic)
          const orb = document.getElementById("s2-orbit"); const N = 16, R = 330;
          for (let i = 0; i < N; i++) {
            const a = (i / N) * Math.PI * 2, d = document.createElement("div"); d.className = "s2-sh"; d.id = "s2sh" + i;
            d.style.transform = `translate(${Math.cos(a) * R}px, ${Math.sin(a) * R}px)`; orb.appendChild(d);
          }
          const tl = gsap.timeline({ paused: true });
          const out = (sel, at) => tl.to(sel + " .ln > span", { yPercent: -135, duration: 0.55, stagger: 0.07, ease: "power3.in" }, at);
          const inn = (sel, at) => tl.fromTo(sel + " .ln > span", { yPercent: 135, rotate: 3 }, { yPercent: 0, rotate: 0, duration: 0.85, stagger: 0.12, ease: "expo.out" }, at);
          tl.fromTo("#s2-world", { scale: 1.0, rotate: 0 }, { scale: 1.08, rotate: -0.6, duration: 19.3, ease: "none" }, 0);

          // beat 1: tokenized
          tl.fromTo(["#s2-b0", "#s2-b1", "#s2-b2"], { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, stagger: 0.18, ease: "power3.inOut" }, 0.25);
          for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) {
            if (r === 6 && c === 2) continue;
            const w = document.createElementNS("http://www.w3.org/2000/svg", "rect"); w.setAttribute("class", "win"); w.setAttribute("x", 72 + c * 86); w.setAttribute("y", 104 + r * 88);
            w.setAttribute("width", 50); w.setAttribute("height", 62); w.setAttribute("rx", 5); w.setAttribute("pathLength", 1); w.setAttribute("id", "s2w" + (r * 5 + c));
            document.getElementById("s2-bsvg").appendChild(w);
          }
          tl.fromTo("#s2-bsvg .win", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, stagger: { each: 0.025, from: "start" }, ease: "power2.out" }, 0.9);
          inn("#s2-ta", 0.4);
          tl.fromTo("#s2-sa", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.3);
          tl.fromTo(".s2-sh", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, stagger: 0.07, ease: "back.out(2)" }, 2.1)
            .to("#s2-orbit", { rotation: 360, duration: 8, ease: "none" }, 2.1)
            .fromTo("#s2-clock", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.6)" }, 2.4)
            .fromTo("#s2-clock .ring", { rotation: 0 }, { rotation: 360, duration: 12, ease: "none" }, 2.4);

          // beat 2: the law doesn't pause; three liens land
          out("#s2-ta", 5.55); tl.to("#s2-sa", { opacity: 0, y: -20, duration: 0.5 }, 5.55);
          inn("#s2-tb", 5.95);
          const land = (chip, ring, y, at) => {
            tl.fromTo(chip, { y: 0, rotate: -12, opacity: 1 }, { y: y + 150, rotate: 0, duration: 0.62, ease: "power3.in" }, at)
              .fromTo(ring, { scale: 0.2, opacity: 1 }, { scale: 7, opacity: 0, duration: 0.8, ease: "power2.out" }, at + 0.6)
              .fromTo("#s2-world", { x: 0 }, { x: 6, duration: 0.04, repeat: 3, yoyo: true, ease: "none" }, at + 0.6).to("#s2-world", { x: 0, duration: 0.04 }, at + 0.76);
          };
          land("#s2-c1", "#s2-r1", 380, 7.55); land("#s2-c2", "#s2-r2", 520, 8.75); land("#s2-c3", "#s2-r3", 670, 9.8);
          tl.to("#s2-bsvg", { filter: "drop-shadow(0 0 16px rgba(239,79,38,.85))", duration: 0.7, ease: "power2.out" }, 10.4)
            .to("#s2-b0, #s2-bsvg .win", { stroke: "#ff7a4d", duration: 0.7 }, 10.4);

          // beat 3: someone must remember; the chain never looks
          tl.set("#s2-ta", { opacity: 0 }, 6.3);
          out("#s2-tb", 12.0); tl.set("#s2-tb", { opacity: 0 }, 12.7);
          inn("#s2-tc", 12.45);
          tl.fromTo("#s2-diag .node", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.25, ease: "power3.out" }, 13.2)
            .fromTo("#s2-dash", { strokeDashoffset: 56 }, { strokeDashoffset: 0, duration: 1.6, ease: "none" }, 13.4)
            .fromTo("#s2-diag svg.abs", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 13.5);
          out("#s2-tc", 15.55); tl.set("#s2-tc", { opacity: 0 }, 16.3); tl.to("#s2-diag", { opacity: 0, y: 20, duration: 0.5, ease: "power2.in" }, 15.55);
          tl.fromTo("#s2-eye", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 15.95)
            .fromTo("#s2-eye svg path:last-child", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 16.5)
            .to("#s2-eye", { opacity: 0, x: -40, duration: 0.5, ease: "power2.in" }, 17.25);

          // beat 4: the shares keep moving
          inn("#s2-td", 17.45);
          tl.to("#s2-orbit", { rotation: "+=900", duration: 2.6, ease: "power2.in" }, 17.4);
          // exit into the next scene
          tl.to("#s2-td .ln > span", { yPercent: -135, duration: 0.5, stagger: 0.06, ease: "power3.in" }, 19.3)
            .to("#s2-world", { opacity: 0, scale: 1.2, filter: "blur(6px)", duration: 0.9, ease: "power2.in" }, 19.3)
            .to(["#s2-clock"], { opacity: 0, duration: 0.5 }, 19.2);
          window.__timelines["s2-problem"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
