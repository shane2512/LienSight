<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s1-root { position: absolute; inset: 0; }
        #s1-world { position: absolute; inset: 0; transform-origin: 62% 60%; }
        .s1-h { position: absolute; left: 118px; font-size: 196px; white-space: nowrap; }
        #s1-ha { top: 150px; } #s1-hb { top: 180px; font-size: 128px; }
        #s1-kick { left: 126px; top: 96px; color: #15181c; }
        /* building */
        #s1-bld { position: absolute; left: 1270px; top: 250px; width: 480px; height: 760px; }
        #s1-wall { position: absolute; inset: 0; border-radius: 10px 10px 0 0; background: linear-gradient(90deg, #f6f1ea 0%, #eae3d9 70%, #ded6ca 100%); box-shadow: 0 40px 80px -30px rgba(10, 30, 60, .55); }
        #s1-cornice { position: absolute; left: -22px; right: -22px; top: -26px; height: 36px; border-radius: 8px; background: #ddd5c9; box-shadow: 0 14px 20px -10px rgba(0,0,0,.25); }
        #s1-door { position: absolute; left: 200px; bottom: 0; width: 80px; height: 130px; border-radius: 40px 40px 0 0; background: #2a3a52; }
        .s1-win { position: absolute; width: 58px; height: 84px; border-radius: 6px 6px 3px 3px; background: #355c8a; box-shadow: inset 0 0 0 5px #f9f6f1, inset 0 -18px 24px rgba(0,0,0,.18); }
        .s1-win.lit { background: #ffd479; }
        #s1-ground { position: absolute; left: 900px; right: -100px; top: 1008px; height: 90px; background: radial-gradient(60% 100% at 50% 0%, rgba(10,30,60,.28), transparent 70%); }
        /* lien card */
        #s1-card { position: absolute; left: 1200px; top: -420px; width: 620px; padding: 34px 38px 36px; transform-origin: 50% 0%; }
        #s1-card .t { display: flex; align-items: center; gap: 12px; color: #6b7480; }
        #s1-card .t i { width: 12px; height: 12px; border-radius: 50%; background: #ef4f26; display: block; }
        #s1-card .big { font: 800 86px/1 "JetBrains Mono", monospace; letter-spacing: -.04em; color: #15181c; margin: 16px 0 6px; }
        #s1-card .d { font: 600 30px/1.1 "Inter Tight", sans-serif; color: #3c434c; }
        #s1-card .r { margin-top: 22px; border-top: 2px dashed #e3e7ec; padding-top: 16px; display: grid; grid-template-columns: 200px 1fr; row-gap: 10px; font: 600 22px/1.2 "JetBrains Mono", monospace; }
        #s1-card .r b { color: #6b7480; font-weight: 600; letter-spacing: .08em; }
        #s1-stamp { position: absolute; right: 26px; top: 34px; padding: 6px 24px; border: 8px solid #ef4f26; border-radius: 12px; color: #ef4f26; font: 900 72px/1 "Archivo", sans-serif; font-stretch: 125%; letter-spacing: .02em; opacity: 0; }
        /* token */
        #s1-coin { position: absolute; left: 300px; top: 650px; width: 250px; height: 250px; }
        #s1-coin .face { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 26%, #ffffff, #e9f1fb 60%, #cfdcee); box-shadow: 0 30px 50px -18px rgba(10,30,60,.55), inset 0 0 0 14px #fff, inset 0 0 0 22px #ef4f26; display: grid; place-items: center; }
        #s1-coin .face span { font: 900 52px/1 "Archivo", sans-serif; font-stretch: 125%; color: #15181c; letter-spacing: -.02em; }
        #s1-ring { position: absolute; left: -46px; top: -46px; width: 342px; height: 342px; border-radius: 50%; border: 4px dotted rgba(21,24,28,.35); }
        #s1-q { position: absolute; left: 490px; top: 530px; width: 150px; height: 150px; border-radius: 50% 50% 50% 8px; background: #fff; display: grid; place-items: center; box-shadow: 0 24px 40px -16px rgba(10,30,60,.5); }
        #s1-q span { font: 900 110px/1 "Archivo", sans-serif; color: #ef4f26; }
        /* wordmark */
        #s1-mark { position: absolute; left: 0; right: 0; top: 380px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
        #s1-mark .row { display: flex; align-items: center; gap: 36px; }
        #s1-mark .lg { width: 168px; height: 168px; border-radius: 50%; background: #ef4f26; display: grid; place-items: center; color: #fff; font: 900 112px/1 "Archivo", sans-serif; font-stretch: 125%; box-shadow: 0 30px 50px -20px rgba(210,58,22,.7); }
        #s1-mark .nm { font-size: 190px; color: #15181c; }
        #s1-mark .sub { margin-top: 34px; color: #15181c; background: rgba(255,255,255,.85); padding: 14px 24px; border-radius: 999px; }
      </style>

      <div id="s1-root" data-composition-id="s1-hook" data-width="1920" data-height="1080">
        <div id="s1-world">
          <div id="s1-ground"></div>
          <div id="s1-bld"><div id="s1-wall"></div><div id="s1-cornice"></div><div id="s1-door"></div></div>
          <div id="s1-card" class="card">
            <div class="t kick"><i></i>ACRIS · RECORDED DOCUMENT</div>
            <div class="big">LOCC</div>
            <div class="d">LIEN OF COMMON CHARGES</div>
            <div class="r"><b>DOCUMENT</b><span>2026092900833001</span><b>RECORDED</b><span>2026-09-30</span><b>PROPERTY</b><span>BRONX 2-5789-1022</span></div>
            <div id="s1-stamp">LIEN</div>
          </div>
          <div id="s1-coin"><div id="s1-ring"></div><div class="face"><span>LSPV</span></div></div>
          <div id="s1-q"><span>?</span></div>
        </div>
        <div id="s1-kick" class="abs kick">Chainlink CRE · Real-world assets</div>
        <div id="s1-ha" class="s1-h disp"><span class="ln"><span class="stip">A lien</span></span><span class="ln"><span class="stip">lands.</span></span></div>
        <div id="s1-hb" class="s1-h disp" style="opacity:0"><span class="ln"><span class="stip">The token</span></span><span class="ln"><span class="stip">has no idea.</span></span></div>
        <div id="s1-mark">
          <div class="row"><div class="lg">L</div><div class="nm disp">Liensight</div></div>
          <div class="sub kick">The token finds out when the building does</div>
        </div>
      </div>

      <script>
        (() => {
          // windows
          const bld = document.getElementById("s1-bld");
          const cols = 5, rows = 8; let n = 0;
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            if (r === rows - 1 && c === 2) continue; // door
            const w = document.createElement("div"); w.className = "s1-win" + (((r * 7 + c * 3) % 5 === 0) ? " lit" : ""); w.id = "s1w" + n++;
            w.style.left = 34 + c * 90 + "px"; w.style.top = 52 + r * 88 + "px"; bld.appendChild(w);
          }
          const tl = gsap.timeline({ paused: true });
          // world: slow push-in, whole scene
          tl.fromTo("#s1-world", { scale: 1.0 }, { scale: 1.07, duration: 11.6, ease: "none" }, 0);
          // building rises, windows light up
          tl.fromTo("#s1-bld", { clipPath: "inset(42% 0 0 0)", y: 30 }, { clipPath: "inset(0% 0 0 0)", y: 0, duration: 1.3, ease: "expo.out" }, 0)
            .fromTo(".s1-win", { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: { each: 0.018, from: "end" }, ease: "power2.out" }, 0.55)
            .fromTo("#s1-ground", { opacity: 0 }, { opacity: 1, duration: 1, ease: "power2.out" }, 0.3);
          // kicker + headline A (kinetic, masked)
          tl.fromTo("#s1-kick", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.5)
            .fromTo("#s1-ha .ln > span", { yPercent: 135, rotate: 4 }, { yPercent: 0, rotate: 0, duration: 1.0, stagger: 0.14, ease: "expo.out" }, 0.7);
          // the lien lands: drop, bounce, stamp, shake
          tl.fromTo("#s1-card", { y: 0, rotate: -9, opacity: 1 }, { y: 520, rotate: -4, duration: 0.95, ease: "bounce.out" }, 1.9)
            .fromTo("#s1-stamp", { scale: 3.2, rotate: -26, opacity: 0 }, { scale: 1, rotate: -13, opacity: 1, duration: 0.28, ease: "power4.in" }, 3.0)
            .fromTo("#s1-world", { x: 0 }, { x: 7, duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, 3.28)
            .to("#s1-world", { x: 0, duration: 0.05 }, 3.58);
          // card docks onto the building front and shrinks
          tl.to("#s1-card", { x: 30, y: 1010, scale: 0.5, rotate: 0, duration: 0.9, ease: "power3.inOut" }, 4.0);
          // headline swaps: "the token has no idea"
          tl.to("#s1-ha .ln > span", { yPercent: -135, duration: 0.6, stagger: 0.08, ease: "power3.in" }, 4.0)
            .set("#s1-hb", { opacity: 1 }, 4.5)
            .fromTo("#s1-hb .ln > span", { yPercent: 135, rotate: 4 }, { yPercent: 0, rotate: 0, duration: 0.9, stagger: 0.14, ease: "expo.out" }, 4.55);
          // the token: enters, floats, has no idea
          tl.fromTo("#s1-coin", { x: -420, opacity: 0, rotate: -120 }, { x: 0, opacity: 1, rotate: 0, duration: 1.2, ease: "back.out(1.5)" }, 4.7)
            .fromTo("#s1-ring", { rotate: 0 }, { rotate: 360, duration: 9, ease: "none" }, 4.7)
            .fromTo("#s1-coin", { y: 0 }, { y: -16, duration: 1.2, yoyo: true, repeat: 4, ease: "sine.inOut" }, 5.9)
            .fromTo("#s1-q", { scale: 0, rotate: -20, opacity: 0, transformOrigin: "0% 100%" }, { scale: 1, rotate: 0, opacity: 1, duration: 0.6, ease: "elastic.out(1,0.55)" }, 7.8);
          // "This is Liensight": clear the stage, wordmark lands
          tl.to(["#s1-hb", "#s1-kick", "#s1-q", "#s1-coin"], { opacity: 0, y: -50, scale: 0.92, duration: 0.7, stagger: 0.04, ease: "power3.in" }, 8.9)
            .to("#s1-bld", { x: 520, opacity: 0, scale: 0.9, duration: 1.2, ease: "power3.inOut" }, 8.9)
            .to("#s1-card", { opacity: 0, duration: 0.5 }, 8.9)
            .fromTo("#s1-mark", { opacity: 0, scale: 0.7, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 1.0, ease: "back.out(1.4)" }, 9.2)
            .fromTo("#s1-mark .lg", { rotate: -200 }, { rotate: 0, duration: 1.1, ease: "expo.out" }, 9.2)
            .fromTo("#s1-mark .nm", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power4.out" }, 9.35)
            .fromTo("#s1-mark .sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.0)
            .to("#s1-mark", { scale: 1.12, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: "power2.in" }, 10.9);
          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
