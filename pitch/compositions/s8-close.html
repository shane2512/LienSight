<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s8-root { position: absolute; inset: 0; color: #15181c; }
        #s8-world { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #s8-mark { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; align-items: center; gap: 44px; }
        #s8-lg { width: 210px; height: 210px; border-radius: 50%; background: #ef4f26; color: #fff; display: grid; place-items: center; font: 900 140px/1 "Archivo", sans-serif; font-stretch: 125%; box-shadow: 0 34px 50px -24px rgba(0,0,0,.4); }
        #s8-nm { font-size: 184px; white-space: nowrap; }
        #s8-tag { position: absolute; left: 0; right: 0; top: 620px; text-align: center; font: 800 58px/1.15 "Inter Tight", sans-serif; letter-spacing: -.02em; }
        #s8-tag .w { display: inline-block; }
        #s8-tag em { font-style: normal; color: #d23a16; }
        #s8-foot { position: absolute; left: 0; right: 0; bottom: 90px; display: flex; justify-content: center; gap: 24px; }
        .s8-p { padding: 14px 24px; border-radius: 999px; background: rgba(255,255,255,.92); font: 700 21px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: #15181c; }
        #s8-fade { position: absolute; inset: 0; background: #0b0e14; opacity: 0; }
      </style>

      <div id="s8-root" data-composition-id="s8-close" data-width="1920" data-height="1080">
        <div id="s8-world">
          <div id="s8-mark"><div id="s8-lg">L</div><div id="s8-nm" class="disp"><span class="ln"><span class="stip">Liensight</span></span></div></div>
          <div id="s8-tag"><span class="w">The token</span> <span class="w">finds out</span> <span class="w">when the</span> <span class="w"><em>building</em></span> <span class="w"><em>does.</em></span></div>
          <div id="s8-foot"><div class="s8-p">BLI Legal Tech Hackathon 2</div><div class="s8-p">Real-world assets</div><div class="s8-p">Chainlink CRE</div></div>
        </div>
        <div id="s8-fade"></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s8-world", { scale: 1.0 }, { scale: 1.06, duration: 5, ease: "none" }, 0);
          tl.fromTo("#s8-lg", { scale: 0, rotate: -260 }, { scale: 1, rotate: 0, duration: 1.1, ease: "expo.out" }, 0.15)
            .fromTo("#s8-nm .ln > span", { yPercent: 135, rotate: 4 }, { yPercent: 0, rotate: 0, duration: 1.0, ease: "expo.out" }, 0.3)
            .fromTo("#s8-tag .w", { opacity: 0, y: 36, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, stagger: 0.22, ease: "power3.out" }, 1.5)
            .fromTo(".s8-p", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.12, ease: "power3.out" }, 3.2)
            .to("#s8-fade", { opacity: 1, duration: 0.4, ease: "power2.in" }, 4.6);
          window.__timelines["s8-close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
